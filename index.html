<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAL Data Sorter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

  <!-- ============ App screen ============ -->
  <section id="app">
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 100 100" width="22" height="22" aria-hidden="true">
          <g fill="currentColor">
            <path d="M 14 18 L 86 18 L 58 50 L 42 50 Z"></path>
            <path d="M 42 58 L 58 58 L 50 86 Z"></path>
          </g>
        </svg>
        <span>PAL Data Sorter</span>
      </div>
      <div class="topbar-actions">
        <span class="meta" id="fetchedMeta"></span>
        <button class="btn btn-ghost btn-sm" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
        <button class="btn btn-secondary btn-sm" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div id="topProgress" class="top-progress hidden"><div class="bar" id="topBar"></div></div>

    <div class="container">
      <div id="modeSwitchWrap" class="mode-switch-wrap hidden">
        <div class="segmented" id="modeSwitch" role="tablist"></div>
      </div>

      <div id="h2h" class="hidden"></div>

      <div class="controls" id="controls">
        <div class="control-group">
          <span>League</span>
          <div class="segmented" id="leagueSeg" role="tablist"></div>
        </div>
        <div class="control-group" id="bracketGroup">
          <span>Bracket</span>
          <div class="segmented" id="bracketSeg" role="tablist"></div>
        </div>
        <div class="spacer"></div>
        <div class="control-group">
          <span>&nbsp;</span>
          <div id="colMenuWrap" class="col-wrap"></div>
        </div>
        <div class="control-group">
          <span>&nbsp;</span>
          <button class="btn btn-primary btn-sm" id="csvBtn">Export CSV</button>
        </div>
      </div>

      <div class="detailbar hidden" id="detailBar"></div>

      <div class="stats" id="stats"></div>

      <div class="table-card" id="tableCard">
        <div class="table-scroll">
          <table id="table">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="empty hidden" id="emptyState">Nothing to show.</div>
      </div>

      <div id="insights" class="hidden"></div>

      <div id="emptyApp" class="empty-app hidden">
        <p>No data loaded yet.</p>
        <p class="sub">Hit <b>Refresh</b> to pull the latest standings, or wait for the daily update.</p>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
